[settings]
legacy_version_file = true

[settings.ruby]
compile = false

[env]
ASDF_PHP_FPM = "1"

[plugins]
php = "https://github.com/ramsey/asdf-php.git"

[tools]
"aqua:aws/aws-cli" = "latest"
"aqua:YS-L/csvlens" = "latest"
"aqua:cloudflare/cloudflared" = "latest"
atuin = "latest"
bat = "latest"
btop = "latest"
bun = "latest"
codex = "latest"
"cargo:terminal-control" = { version = "latest", depends = "zig" }
"cargo:tuicr" = "latest"
delta = "latest"
elixir = "latest"
erlang = "latest"
eza = "latest"
fastfetch = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
"github:tectonic-typesetting/tectonic" = "latest"
go = "latest"
herdr = "latest"
"aqua:modem-dev/hunk" = "latest"
jq = "latest"
lazydocker = "latest"
lazygit = "latest"
node = "lts"
"npm:@kitlangton/ghui" = { version = "latest", allow_low_downloads = true }
"npm:@kitlangton/stack" = { version = "latest", allow_low_downloads = true, trust_policy_excludes = [
  "@effect/platform-node@4.0.0-beta.64",
  "effect@4.0.0-beta.64",
] }
"npm:@mermaid-js/mermaid-cli" = { version = "latest", trust_policy_excludes = [
  "cytoscape@3.34.1",
] }
"npm:agent-browser" = "latest"
"npm:cloc" = "latest"
"npm:pm2" = "latest"
"npm:portless" = "latest"
# uses ramsey/asdf-php (static binaries, no phpize/php-config)
php = "8.4"
pi = "latest"
pitchfork = "latest"
pnpm = "latest"
python = ["3.12", "3.11"]
ripgrep = "latest"
ruby = "latest"
rust = "latest"
sentry-cli = "latest"
starship = "latest"
tmux = "latest"
tree-sitter = "latest"
uv = "latest"
wacli = "latest"
zig = ["0.15.2", "0.13"]
zoxide = "latest"
